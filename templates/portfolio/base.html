{% load static %}<!DOCTYPE html>
<html lang="{{ lang }}">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0d1117">
<meta name="color-scheme" content="dark">
<title>{{ page_title }}</title>
<meta name="description" content="{{ page_description }}">
<link rel="canonical" href="{{ canonical_url }}">
{% for alt in alternates %}<link rel="alternate" hreflang="{{ alt.code }}" href="{{ alt.url }}">
{% endfor %}<link rel="alternate" hreflang="x-default" href="{{ x_default_url }}">

<link rel="icon" type="image/svg+xml" href="{% static 'portfolio/img/favicon.svg' %}">
<link rel="icon" type="image/png" sizes="32x32" href="{% static 'portfolio/img/favicon-32.png' %}">
<link rel="apple-touch-icon" href="{% static 'portfolio/img/apple-touch-icon.png' %}">

<meta property="og:type" content="{% block og_type %}profile{% endblock %}">
<meta property="og:site_name" content="{{ profile.full_name }}">
<meta property="og:title" content="{{ page_title }}">
<meta property="og:description" content="{{ page_description }}">
<meta property="og:url" content="{{ canonical_url }}">
<meta property="og:image" content="{{ og_image_url }}">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="{{ profile.full_name }} — {{ strings.hero_role }}">
<meta property="og:locale" content="{{ og_locale }}">
{% for loc in og_locale_alternates %}<meta property="og:locale:alternate" content="{{ loc }}">
{% endfor %}<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:creator" content="@{{ social_handle }}">
<meta name="twitter:title" content="{{ page_title }}">
<meta name="twitter:description" content="{{ page_description }}">
<meta name="twitter:image" content="{{ og_image_url }}">

{% if lang == "ru" %}<link rel="preload" href="{% static 'portfolio/fonts/ibm-plex-sans-cyrillic-wght-normal.woff2' %}" as="font" type="font/woff2" crossorigin>
{% else %}<link rel="preload" href="{% static 'portfolio/fonts/ibm-plex-sans-latin-wght-normal.woff2' %}" as="font" type="font/woff2" crossorigin>
{% endif %}<link rel="stylesheet" href="{% static 'portfolio/css/fonts.css' %}">
<link rel="stylesheet" href="{% static 'portfolio/css/style.css' %}">
<script type="application/ld+json">{{ jsonld }}</script>
</head>
<body>

<a class="skip-link" href="#main">{{ strings.skip_link }}</a>

{% block content %}{% endblock %}

<script src="{% static 'portfolio/js/site.js' %}" defer></script>
</body>
</html>
